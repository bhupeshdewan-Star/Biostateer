steps:
  # 1. Build the Docker Image with built-in build arguments for version metadata
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_APP_VERSION=1.3.2'
      - '--build-arg'
      - 'VITE_BUILD_DATE=2026.06.01'
      - '--build-arg'
      - 'VITE_VALIDATION_REGISTRY=1.0'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/biostateer-repo/biostateer-app:v1.3.2'
      - '.'

  # 2. Push the compiled image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/biostateer-repo/biostateer-app:v1.3.2'

  # 3. Deploy to managed Google Cloud Run with autoscaling and public accessibility
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'biostateer-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/biostateer-repo/biostateer-app:v1.3.2'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'VITE_APP_VERSION=1.3.2,VITE_BUILD_DATE=2026.06.01,VITE_VALIDATION_REGISTRY=1.0'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/biostateer-repo/biostateer-app:v1.3.2'
options:
  logging: CLOUD_LOGGING_ONLY
