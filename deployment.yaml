apiVersion: apps/v1
kind: Deployment
metadata:
  name: biostateer-api-deployment
  namespace: biostateer-production
  labels:
    app: biostateer-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biostateer-api
  template:
    metadata:
      labels:
        app: biostateer-api
    spec:
      containers:
      - name: api-container
        image: gcr.io/biostateer-production/api-engine:v1.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: biostateer-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: biostateer-secrets
              key: jwt-secret
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: biostateer-api-service
  namespace: biostateer-production
spec:
  selector:
    app: biostateer-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
